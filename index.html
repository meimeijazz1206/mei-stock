:root{--bg:#faf9f7;--fg:#1c1b19;--muted:#7a746c;--card:#fff;--grid:#e6e2db;--accent:#c8641e}

label{display:flex;align-items:center;gap:7px;justify-content:center;font-size:12.5px;

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const enc=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey(
  {name:'PBKDF2',salt:b(D.s),iterations:D.n,hash:'SHA-256'},km,
  {name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
 const html=new TextDecoder().decode(pt);
 // 用 iframe srcdoc:腳本會正常執行,外層網址不變(重新整理仍可用)
 const f=document.createElement('iframe');
 f.setAttribute('style','position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent');
 f.setAttribute('srcdoc',html);
 document.body.innerHTML='';
 document.documentElement.style.height='100%';
 document.body.style.cssText='margin:0;padding:0;height:100%;display:block';
 document.body.appendChild(f);
}
const err=document.getElementById('err'),pw=document.getElementById('pw'),go=document.getElementById('go');
async function tryOpen(p,silent){
 if(!p)return;
 go.disabled=true;err.textContent=silent?'':'解密中…';
 try{
  if(document.getElementById('rm').checked){try{localStorage.setItem('mk',p)}catch(e){}}
  await open_(p);
 }catch(e){
  go.disabled=false;err.textContent=silent?'':'密語不正確';
  try{localStorage.removeItem('mk')}catch(e2){}
 }
}
go.onclick=()=>tryOpen(pw.value,false);
pw.onkeydown=e=>{if(e.key==='Enter')tryOpen(pw.value,false)};
try{const sv=localStorage.getItem('mk'); if(sv)tryOpen(sv,true);}catch(e){}
pw.focus();
</script></body></html>
